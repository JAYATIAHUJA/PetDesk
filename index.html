<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PetDesk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      height: 100%;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── Pet canvas ── */
    #pet-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      image-rendering: pixelated;
      pointer-events: auto;
    }

    #pet-canvas:active { cursor: grabbing; }

    /* ── Speech bubble ── */
    #bubble {
      position: absolute;
      /* Position will be set dynamically based on pet coordinates */
      max-width: 260px;
      min-width: 120px;
      background: white;
      border: 2.5px solid #1a1a2e;
      border-radius: 14px;
      padding: 10px 14px;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #1a1a2e;
      box-shadow: 3px 3px 0 #1a1a2e;
      opacity: 0;
      transform: scale(0.8) translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: auto;
      z-index: 10;
    }

    #bubble.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* bubble tail */
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 20px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #1a1a2e;
    }
    #bubble::before {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 21px;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 9px solid white;
      z-index: 1;
    }

    /* ── Alert bubble variants ── */
    #bubble.overdue {
      background: #fff0f0;
      border-color: #e53e3e;
      box-shadow: 3px 3px 0 #e53e3e;
    }
    #bubble.overdue::after { border-top-color: #e53e3e; }

    #bubble.urgent {
      background: #fffbeb;
      border-color: #d97706;
      box-shadow: 3px 3px 0 #d97706;
      animation: pulse-border 1s infinite;
    }
    #bubble.urgent::after { border-top-color: #d97706; }

    #bubble.warning { border-color: #3b82f6; box-shadow: 3px 3px 0 #3b82f6; }
    #bubble.warning::after { border-top-color: #3b82f6; }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 3px 3px 0 #d97706; }
      50% { box-shadow: 3px 3px 0 #f59e0b, 0 0 12px rgba(217,119,6,0.4); }
    }

    /* ── Bubble buttons ── */
    .bubble-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .bubble-btn {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1.5px solid currentColor;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      transition: background 0.15s;
    }

    .bubble-btn.dismiss { color: #6b7280; }
    .bubble-btn.dismiss:hover { background: #f3f4f6; }
    .bubble-btn.snooze { color: #3b82f6; }
    .bubble-btn.snooze:hover { background: #eff6ff; }
    .bubble-btn.done { color: #10b981; }
    .bubble-btn.done:hover { background: #ecfdf5; }

    /* ── Confetti ── */
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confetti-fall 1.5s ease-in forwards;
      pointer-events: none;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120px) rotate(540deg); opacity: 0; }
    }

    /* ── Mood selector ── */
    #mood-bar {
      position: absolute;
      /* Position will be set dynamically based on pet coordinates */
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 12;
    }

    #mood-bar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mood-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: #1a1a2e;
      padding: 0;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.15s;
    }
    .mood-btn:hover { transform: scale(1.2); }
    .mood-btn svg { pointer-events: none; overflow: visible; }

    #focus-hud {
      position: absolute;
      right: 18px;
      top: 18px;
      display: none;
      min-width: 170px;
      padding: 9px 12px;
      border: 1px solid rgba(26,26,46,0.45);
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      color: #1a1a2e;
      font: 12px/1.35 'Segoe UI', sans-serif;
      box-shadow: 2px 2px 0 rgba(26,26,46,0.35);
      pointer-events: auto;
      z-index: 11;
    }
    #focus-hud.visible { display: block; }
    #focus-hud strong { display: block; margin-bottom: 2px; }
    #focus-hud small { color: #5d6075; }
  </style>
</head>
<body>
<div id="stage">
  <canvas id="pet-canvas" width="128" height="128"></canvas>

  <div id="mood-bar">
    <button class="mood-btn" data-mood="focused" title="Focused" data-icon="target"></button>
    <button class="mood-btn" data-mood="tired" title="Tired" data-icon="moon"></button>
    <button class="mood-btn" data-mood="anxious" title="Anxious" data-icon="swirl"></button>
    <button class="mood-btn" data-mood="great" title="Great" data-icon="sparkle"></button>
    <button class="mood-btn" id="settings-btn" title="Settings" data-icon="sliders" style="background: #7b2fff; color: white; border-color: #7b2fff;"></button>
  </div>

  <div id="bubble"></div>
  <div id="focus-hud"><strong id="focus-task-label">Focus session</strong><span id="focus-time-label">00:00</span><br /><small id="focus-status-label">Ready</small></div>
</div>

<script type="module" src="renderer.mjs"></script>
</body>
</html>
